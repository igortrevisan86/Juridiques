<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Juridiquês — Aprenda Direito de forma gamificada. Trilhas, lições e exercícios interativos para estudantes de Direito." />
    <meta name="theme-color" content="#1E3A8A" />
    <title>Juridiquês — Aprenda Direito</title>
    <script>
      // Aplica o tema antes do primeiro paint para evitar flash
      (function () {
        try {
          var t = localStorage.getItem('juridiques.theme.v1');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
